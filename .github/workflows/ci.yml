name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  ci:
    name: Lint · Typecheck · Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # The test suite uses mongodb-memory-server internally, so MONGO_URI is a
      # placeholder that satisfies env.ts validation — no real DB is required.
      MONGO_URI: mongodb://localhost:27017/mini-erp-ci
      JWT_ACCESS_SECRET: ci-access-secret-not-for-production
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_SECRET: ci-refresh-secret-not-for-production
      JWT_REFRESH_EXPIRES_IN: 7d
      NODE_ENV: test
      UPLOAD_DIR: /tmp/mini-erp-uploads
      MAX_UPLOAD_SIZE_MB: 5
      # Cache the mongodb-memory-server binary so the first CI run isn't slow.
      MONGOMS_DOWNLOAD_DIR: ~/.cache/mongodb-binaries

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Cache mongodb-memory-server binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binary-${{ runner.os }}-${{ hashFiles('**/package.json') }}
          restore-keys: |
            mongodb-binary-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Test with coverage
        run: pnpm test:coverage
